<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
    <link rel="stylesheet" href="./css/admission.css">
    <script defer src="./js/admission.js"></script>
</head>
<body>
    <section class="form-container">
        <h2 class="form-title">Admission Form</h2>
        <form id="admissionForm">
            <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-input" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" id="phone" class="form-input" placeholder="Enter your phone number" required>
            </div>
            <div class="form-group">
                <label for="country" class="form-label">Country Preference</label>
                <input type="text" id="country" class="form-input" placeholder="Enter your country preference" required>
            </div>
            <button type="submit" class="form-button">Submit</button>
        </form>
    </section>
</body>
</html>
