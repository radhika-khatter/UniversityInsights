<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

  function gtag(){dataLayer.push(arguments);}

</script>
<script>
    !function(f,b,e,v,n,t,s)

    n.callMethod.apply(n,arguments):n.queue.push(arguments)};

<body class="bg-gray-100">
    <section class="max-w-lg mx-auto bg-white p-6 shadow-md rounded-lg mt-10">
        <h2 class="text-2xl font-bold text-center mb-4">Admission Form</h2>
        <form id="admissionForm">
            <div class="mb-4">
                <label class="block font-semibold">Name</label>
                <input type="text" id="name" class="w-full border p-2 rounded" placeholder="Enter your name" required>
            </div>
            <div class="mb-4">
                <label class="block font-semibold">Email</label>
                <input type="email" id="email" class="w-full border p-2 rounded" placeholder="Enter your email" required>
            </div>
            <div class="mb-4">
                <label class="block font-semibold">Phone</label>
                <input type="text" id="phone" class="w-full border p-2 rounded" placeholder="Enter your phone number" required>
            </div>
            <div class="mb-4">
                <label class="block font-semibold">Country Preference</label>
                <input type="text" id="country" class="w-full border p-2 rounded" placeholder="Enter your country preference" required>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded">Submit</button>
        </form>
    </section>

    <script src="./js/admission.js"></script>
</body>
</html>
